services:
  - type: web
    name: toolstack-ai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: toolstack-ai-db
          property: connectionString

databases:
  - name: toolstack-ai-db
    plan: free
    postgresMajorVersion: 15
